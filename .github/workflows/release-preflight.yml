name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact pushed commit SHA to validate
        required: true
        type: string
      real_state_evidence_id:
        description: Completion-evidence ID for isolated real-state validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-15
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact target SHA
        env:
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git cat-file -t "$TARGET_SHA")" = commit

      - name: Require an arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install fish
        run: brew install fish

      - name: Run technical preflight
        run: make release-verify

      - name: Build and verify candidate artifacts
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          ARTIFACT_VERSION="preflight-$TARGET_SHA"
          make release-artifact-verify \
            VERSION="$ARTIFACT_VERSION" \
            COMMIT="$TARGET_SHA" \
            BRANCH=preflight

      - name: Write preflight evidence manifest
        env:
          REAL_STATE_EVIDENCE_ID: ${{ inputs.real_state_evidence_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          ARTIFACT_VERSION="preflight-$TARGET_SHA"
          ruby scripts/release-preflight-manifest.rb create \
            dist/release-preflight.json \
            "$GITHUB_REPOSITORY" \
            "$TARGET_SHA" \
            "$GITHUB_RUN_ID" \
            "$REAL_STATE_EVIDENCE_ID" \
            "$GITHUB_RUN_NUMBER" \
            "dist/agentdeck_${ARTIFACT_VERSION}_checksums.txt"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ inputs.target_sha }}
          path: |
            dist/release-preflight.json
            dist/agentdeck_preflight-${{ inputs.target_sha }}_darwin_arm64.tar.gz
            dist/agentdeck_preflight-${{ inputs.target_sha }}_darwin_amd64.tar.gz
            dist/agentdeck_preflight-${{ inputs.target_sha }}_checksums.txt
          if-no-files-found: error
          retention-days: 90

  desktop:
    # The desktop half of the technical preflight. It proves the exact target
    # commit builds, signs, and assembles a universal candidate; it produces no
    # publishable artifact, because it signs ad-hoc and never notarizes.
    runs-on: macos-26
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact target SHA
        env:
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Select the pinned Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z $xcode ]]; then
            echo "no Xcode 26 installation is available on this runner" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Swift tests and the widget sandbox gate
        run: |
          make test-macos-app
          make check-widget-sandbox

      - name: Build and package the desktop candidate
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          app_version=$(awk -F'=' '/^AGENTDECK_MARKETING_VERSION/ { gsub(/ /, "", $2); print $2 }' \
            apps/macos/Config/AgentDeck.xcconfig)
          test -n "$app_version"
          make build-macos-release \
            VERSION="v$app_version" \
            COMMIT="$TARGET_SHA" \
            BRANCH=preflight \
            APP_VERSION="$app_version" \
            APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          AGENTDECK_SKIP_NOTARIZATION=1 make package-macos-app VERSION="v$app_version"
