name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# Cancel stale runs for the same event/ref without cancelling push against PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      base: ${{ steps.diff.outputs.base }}
      head: ${{ steps.diff.outputs.head }}
      doc_base: ${{ steps.diff.outputs.doc_base }}
      doc_head: ${{ steps.diff.outputs.doc_head }}
      doc_scope_known: ${{ steps.diff.outputs.doc_scope_known }}
      doc_reason: ${{ steps.diff.outputs.doc_reason }}
    steps:
      - name: Check out repository and diff history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify using the trusted base script
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          trusted="$(mktemp)"
          trap 'rm -f "$trusted"' EXIT
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git show "$BASE_SHA:scripts/ci/classify_diff.py" > "$trusted"; then
            python3 "$trusted" --event "$GITHUB_EVENT_PATH" \
              --event-name "$EVENT_NAME" --output "$GITHUB_OUTPUT"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'No trusted classifier/base; run full verification.'
          fi
          python3 scripts/ci/doc_scope.py --event "$GITHUB_EVENT_PATH" \
            --event-name "$EVENT_NAME" --output "$GITHUB_OUTPUT"

  documentation:
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the event candidate, including the PR merge tree. A release
          # head can predate the document tools required by the base workflow.
      - name: Set up Node for the native OpenCode adapter tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CI classification and review-record tools
        run: make check-ci-docs-tools check-opencode-hooks
      - name: Document L0, links, document set and review records
        if: ${{ !cancelled() }}
        env:
          DOC_SCOPE_KNOWN: ${{ needs.classify.outputs.doc_scope_known }}
          DOC_REASON: ${{ needs.classify.outputs.doc_reason }}
          DIFF_BASE: ${{ needs.classify.outputs.doc_base }}
          DIFF_HEAD: ${{ needs.classify.outputs.doc_head }}
        run: |
          if [[ "$DOC_SCOPE_KNOWN" != true || -z "$DIFF_BASE" || -z "$DIFF_HEAD" ]]; then
            echo "范围未知: $DOC_REASON; document gate is blocked." >&2
            exit 1
          fi
          python3 scripts/check-docs.py --base "$DIFF_BASE" --head "$DIFF_HEAD"

  portable:
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whitespace and the Go test runner
        run: make check-whitespace check-go-test-runner

  go_checks:
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: macos-15
    env:
      AGENTDECK_GO_TEST_REPORT_PACKAGES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: GOCACHE="$(go env GOCACHE)" make test
      - name: Go vet
        run: GOCACHE="$(go env GOCACHE)" make vet

  race:
    name: Go race (${{ matrix.shard }})
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # A matrix result can omit a shard that never acquired a runner.
    outputs:
      shard_0: ${{ steps.tests.outputs.shard_0 }}
      shard_1: ${{ steps.tests.outputs.shard_1 }}
      shard_2: ${{ steps.tests.outputs.shard_2 }}
    env:
      AGENTDECK_GO_TEST_REPORT_PACKAGES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test package shard
        id: tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          export GOCACHE="$(go env GOCACHE)"
          packages=$(go list -mod=vendor ./... | python3 scripts/ci/go_race_packages.py "$SHARD")
          make test-race GO_RACE_PACKAGES="$packages"
          printf 'shard_%s=success\n' "$SHARD" >> "$GITHUB_OUTPUT"

  verify:
    needs: [classify, documentation, portable, go_checks, race]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable verification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          GO_CHECKS_RESULT: ${{ needs.go_checks.result }}
          RACE_RESULT: ${{ needs.race.result }}
          RACE_SHARD_0: ${{ needs.race.outputs.shard_0 }}
          RACE_SHARD_1: ${{ needs.race.outputs.shard_1 }}
          RACE_SHARD_2: ${{ needs.race.outputs.shard_2 }}
        run: |
          test "$DOCUMENTATION_RESULT" = success
          if [[ "$CLASSIFY_RESULT" == success && "$DOCS_ONLY" == true ]]; then
            echo 'Document L0, links, document set and review-record checks passed.'
            exit 0
          fi
          test "$PORTABLE_RESULT" = success
          test "$GO_CHECKS_RESULT" = success
          test "$RACE_RESULT" = success
          for shard in 0 1 2; do
            result="RACE_SHARD_$shard"
            if [[ "${!result}" != success ]]; then
              echo "Race shard $shard did not report success." >&2
              exit 1
            fi
          done

  desktop:
    needs: [classify, documentation]
    if: ${{ !cancelled() }}
    # The desktop surfaces need the macOS 26 SDK, so they get their own runner
    # and their own job: a Swift toolchain failure must not be reported as a Go
    # verification failure, and the Go gate must not wait on Xcode.
    runs-on: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-26' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Documents-only success
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$DOCUMENTATION_RESULT" = success
          echo 'Documents-only L0 checks passed; desktop product checks are not applicable.'
      - name: Select the pinned Xcode
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z $xcode ]]; then
            echo "no Xcode 26 installation is available on this runner" >&2
            ls -d /Applications/Xcode* >&2 || true
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Set up Go
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Swift targets and run Swift unit tests
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        # Also validates the Go/Swift wire fixtures: the standalone verifier and
        # the Swift test targets both decode the committed fixture set.
        run: make test-macos-app
      - name: Build the app without publishing it
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        run: make build-macos-app
      - name: Check the widget sandbox boundary
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        run: make check-widget-sandbox
      - name: Check desktop refresh integration contract
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          make check-desktop-refresh-integration
      - name: Check desktop distribution in isolation
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true' }}
        run: make check-macos-distribution
      - name: Require documentation checks
        if: ${{ !cancelled() }}
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: test "$DOCUMENTATION_RESULT" = success
